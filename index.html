function useInView(threshold=0.12){
  const ref=useRef(null);
  const [visible,setVisible]=useState(false);
  useEffect(()=>{
    const el=ref.current; if(!el) return;
    const obs=new IntersectionObserver(([e])=>{if(e.isIntersecting){setVisible(true);obs.disconnect();}},{threshold});
    obs.observe(el); return ()=>obs.disconnect();
  },[]);
  return [ref,visible];
}

function useCountUp(target,duration=1600,start=false){
  const [count,setCount]=useState(0);
  useEffect(()=>{
    if(!start||typeof target!=='number') return;
    const t0=performance.now();
    const tick=(now)=>{
      const p=Math.min((now-t0)/duration,1);
      setCount(Math.round((1-Math.pow(1-p,3))*target));
      if(p<1) requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  },[start,target,duration]);
  return count;
}

function useNavShadow(){
  useEffect(()=>{
    const nav=document.querySelector('.nav-bar'); if(!nav) return;
    const handler=()=>nav.classList.toggle('scrolled',window.scrollY>12);
    window.addEventListener('scroll',handler,{passive:true});
    return ()=>window.removeEventListener('scroll',handler);
  },[]);
}

    h(Navbar),h(Hero),h(TrendingDests),h(MostLovedJourneys),h(TrustStrip),h(Verticals),h(Reassurance),h(TrustSection),h(Footer)
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>

    <script>
        const filterButtons = document.querySelectorAll('.btn-filter');
        const galleryItems = document.querySelectorAll('.gallery-item');
        const lightbox = document.getElementById('lightbox');
        let currentImageIndex = 0;
        let allGalleryImages = [];

        // Build gallery array from actual images in the DOM
        function initializeGalleryImages() {
            allGalleryImages = [];
            galleryItems.forEach((item) => {
                const img = item.querySelector('img');
                if (img && img.src) {
                    allGalleryImages.push({
                        src: img.src,
                        alt: img.alt
                    });
                }
            });
        }

        // Initialize on page load
        initializeGalleryImages();

        // Filter functionality
        filterButtons.forEach(button => {
            button.addEventListener('click', (e) => {
                const filter = e.target.dataset.filter;

                // Update active button
                filterButtons.forEach(btn => btn.classList.remove('active'));
                e.target.classList.add('active');

                // Filter gallery items
                galleryItems.forEach((item, index) => {
                    const category = item.dataset.category;
                    if (filter === 'all' || category === filter) {
                        item.classList.remove('hidden');
                    } else {
                        item.classList.add('hidden');
                    }
                });
            });
        });

        // Lightbox functionality - click on image to open
        galleryItems.forEach((item) => {
            item.addEventListener('click', () => {
                const img = item.querySelector('img');
                if (img && img.src) {
                    // Find the index of the clicked image in all gallery images
                    currentImageIndex = allGalleryImages.findIndex(image => image.src === img.src);
                    openLightbox(img.src);
                }
            });
        });

        function openLightbox(imageSrc) {
            document.getElementById('lightbox-img').src = imageSrc;
            lightbox.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            lightbox.classList.remove('active');
            document.body.style.overflow = 'auto';
        }

        function nextImage() {
            currentImageIndex = (currentImageIndex + 1) % allGalleryImages.length;
            openLightbox(allGalleryImages[currentImageIndex].src);
        }

        function prevImage() {
            currentImageIndex = (currentImageIndex - 1 + allGalleryImages.length) % allGalleryImages.length;
            openLightbox(allGalleryImages[currentImageIndex].src);
        }

        function scrollToTop() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Keyboard navigation for lightbox
        document.addEventListener('keydown', (e) => {
            if (lightbox.classList.contains('active')) {
                if (e.key === 'ArrowRight') nextImage();
                if (e.key === 'ArrowLeft') prevImage();
                if (e.key === 'Escape') closeLightbox();
            }
        });

        // Close lightbox when clicking outside content
        lightbox.addEventListener('click', (e) => {
            if (e.target === lightbox) {
                closeLightbox();
            }
        });
    </script>

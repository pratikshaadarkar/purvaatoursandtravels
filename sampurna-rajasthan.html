<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sampurna Rajasthan | Purvaa Tours & Travels</title>

  <script>tailwind.config={theme:{extend:{colors:{pp:'#432267',py:'#FEED01'}}}}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,800;1,700&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>

  <link rel="stylesheet" href="./assets/css/style.css">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth}
    body{font-family:'DM Sans',system-ui,sans-serif;background:#fff;color:#1A1A1A}
    h1,h2,h3,h4{font-family:'Playfair Display',Georgia,serif}

    /* ── NAV ── */
    .nav-bar{background:#432267;position:sticky;top:0;z-index:999;transition:box-shadow .3s}
    .nav-bar.scrolled{box-shadow:0 2px 20px rgba(0,0,0,.25)}

    /* ── PHOTO MOSAIC ── */
    .mosaic{height:500px;overflow:hidden}
    .mosaic img{width:100%;height:100%;object-fit:cover;object-position:center 60%;display:block;transition:transform .5s}
    .mosaic:hover img{transform:scale(1.03)}

    /* ── MAIN LAYOUT ── */
    .tp-wrap{max-width:1240px;margin:0 auto;padding:0 40px}
    .tp-layout{display:grid;grid-template-columns:1fr 320px;gap:52px;padding:0 0 72px;align-items:start}
    .tp-content{}
    .tp-aside{}

    /* ── BREADCRUMB ── */
    .breadcrumb{font-size:14px;color:#999;margin-bottom:10px;font-family:'DM Sans',sans-serif;display:flex;align-items:center;gap:5px;padding-top:32px}
    .breadcrumb a{color:#999;text-decoration:none;transition:color .2s}
    .breadcrumb a:hover{color:#432267}
    .breadcrumb span{color:#bbb}

    /* ── TITLE ── */
    .page-title{font-size:42px;font-weight:800;color:#1A1A1A;line-height:1.2;margin-bottom:20px}

    /* ── TAB NAV ── */
    .tab-nav{position:sticky;top:86px;z-index:900;background:#432267;border-bottom:2px solid #432267;box-shadow:0 2px 8px rgba(67,34,103,0.07);margin:0 -40px;padding:0 40px}
    .tab-nav-inner{display:flex;align-items:center;gap:0;overflow-x:auto;scrollbar-width:none}
    .tab-nav-inner::-webkit-scrollbar{display:none}
    .tab-btn{display:inline-flex;align-items:center;padding:16px 22px;font-size:14px;font-weight:600;color:rgba(255,255,255,0.75);cursor:pointer;border:none;background:none;white-space:nowrap;border-bottom:3px solid transparent;margin-bottom:-2px;transition:color .2s;font-family:'DM Sans',sans-serif;letter-spacing:.01em}
    .tab-btn:hover{color:#fff}
    .tab-btn.active{color:#FEED01;border-bottom-color:#FEED01}

    /* ── SECTION HEADINGS ── */
    .tp-h2{font-size:29px;font-weight:800;color:#1A1A1A;margin-bottom:18px}
    .tp-section{margin-bottom:44px;padding-top:36px}
    .body-p{font-size:15px;color:#444;line-height:1.8;font-family:'DM Sans',sans-serif;margin-bottom:14px}

    /* ── WHAT'S INCLUDED ── */
    .inc-grid{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid #e8e0f5;border-radius:8px;overflow:hidden}
    .inc-item{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;font-size:15px;color:#333;font-family:'DM Sans',sans-serif;border-bottom:1px solid #e8e0f5;border-right:1px solid #e8e0f5;line-height:1.45}
    .inc-item:nth-child(even){border-right:none}
    .inc-item:nth-last-child(-n+2){border-bottom:none}
    .inc-sq{width:18px;height:18px;background:#432267;border-radius:3px;flex-shrink:0;display:flex;align-items:center;justify-content:center;margin-top:1px}

    /* ── ITINERARY TIMELINE ── */
    .itin-wrap{}
    .itin-item{display:flex;gap:0}
    .itin-track{display:flex;flex-direction:column;align-items:center;width:48px;flex-shrink:0}
    .itin-circle{width:34px;height:34px;border-radius:50%;border:2px solid #d0c5e8;background:#fff;display:flex;align-items:center;justify-content:center;z-index:1;flex-shrink:0}
    .itin-circle.active{border-color:#432267;background:#432267}
    .itin-circle-text{font-size:9px;font-weight:800;color:#432267;line-height:1;text-align:center;font-family:'DM Sans',sans-serif}
    .itin-circle.active .itin-circle-text{color:#fff}
    .itin-vline{width:2px;background:#e0d8f0;flex:1;min-height:16px}
    .itin-body{flex:1;padding-bottom:24px}
    .itin-row{display:flex;align-items:flex-start;justify-content:space-between;padding:8px 0 4px;cursor:pointer;gap:12px}
    .itin-day-label{font-size:12px;color:#aaa;font-weight:700;text-transform:uppercase;letter-spacing:.1em;margin-bottom:3px;font-family:'DM Sans',sans-serif}
    .itin-title{font-size:18px;font-weight:700;color:#1A1A1A;font-family:'DM Sans',sans-serif;line-height:1.3}
    .itin-chevron{color:#432267;flex-shrink:0;margin-top:6px;transition:transform .3s}
    .itin-chevron.open{transform:rotate(180deg)}
    .itin-expand{overflow:hidden;transition:max-height .35s ease}
    .itin-expand.open{max-height:800px}
    .itin-expand.closed{max-height:0}
    .itin-desc{font-size:15px;color:#555;line-height:1.75;font-family:'DM Sans',sans-serif;margin-bottom:10px;padding-right:16px}

    /* ── SIDEBAR CARD ── */
    .sidebar-card{position:sticky;top:78px;background:#fff;border:1px solid #ddd;border-radius:8px;overflow:visible;margin-top:36px}
    .sidebar-card-inner{padding:22px;position:relative}
    .sidebar-best-badge{position:absolute;top:-1px;right:18px;background:#FEED01;color:#432267;font-size:9px;font-weight:800;padding:4px 14px;border-radius:0 0 6px 6px;letter-spacing:.12em;text-transform:uppercase;font-family:'DM Sans',sans-serif}
    .sidebar-days{font-size:34px;font-weight:800;color:#1A1A1A;font-family:'DM Sans',sans-serif;line-height:1;margin-bottom:2px}
    .sidebar-tour{font-size:16px;color:#777;font-family:'DM Sans',sans-serif;margin-bottom:14px}
    .sidebar-price{font-size:36px;font-weight:800;color:#432267;font-family:'DM Sans',sans-serif;line-height:1;margin-bottom:2px}
    .sidebar-orig{font-size:13px;color:#bbb;text-decoration:line-through;font-family:'DM Sans',sans-serif;margin-bottom:14px}
    .sidebar-sep{border:none;border-top:1px solid #eee;margin:14px 0}
    .sidebar-meta{font-size:15px;color:#555;font-family:'DM Sans',sans-serif;display:flex;align-items:center;gap:7px;margin-bottom:7px}
    .sidebar-meta svg{flex-shrink:0}
    .sidebar-icons-row{display:flex;gap:0;border:1px solid #eee;border-radius:6px;overflow:hidden;margin:4px 0}
    .sidebar-icon-col{flex:1;padding:11px 6px;text-align:center;border-right:1px solid #eee;display:flex;flex-direction:column;align-items:center;gap:4px}
    .sidebar-icon-col:last-child{border-right:none}
    .sidebar-icon-lbl{font-size:13px;color:#888;font-family:'DM Sans',sans-serif;font-weight:600}
    .sidebar-cta-main{display:block;width:100%;background:#1A1A1A;color:#fff;text-align:center;padding:14px;border-radius:6px;font-weight:800;font-size:15px;text-decoration:none;border:none;cursor:pointer;font-family:'DM Sans',sans-serif;letter-spacing:.02em;transition:background .2s;margin-top:14px}
    .sidebar-cta-main:hover{background:#432267}
    .sidebar-cta-wa{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;background:#FEED01;color:#432267;text-align:center;padding:11px;border-radius:6px;font-weight:700;font-size:14px;text-decoration:none;border:none;cursor:pointer;font-family:'DM Sans',sans-serif;margin-top:8px;transition:opacity .2s}
    .sidebar-cta-wa:hover{opacity:.88}
    .sidebar-trust{text-align:center;font-size:11px;color:#aaa;font-family:'DM Sans',sans-serif;margin-top:10px}

    /* ── RESPONSIVE ── */
    @media(max-width:1024px){
      .tp-layout{grid-template-columns:1fr;gap:0}
      .tp-aside{order:-1;margin-bottom:28px;padding-bottom:0}
      .sidebar-card{position:static;margin-top:0}
      .mosaic{height:380px}
      .tab-nav{margin:0 -24px;padding:0 24px}
    }
    @media(max-width:640px){
      .tp-wrap{padding:0 20px}
      .mosaic{height:260px}
      .page-title{font-size:28px}
      .inc-grid{grid-template-columns:1fr}
      .inc-item{border-right:none !important}
      .tab-nav{margin:0 -20px;padding:0 20px}
    }
  
    /* ── NAVBAR: fixed position fix ── */
    .nav-bar{position:fixed !important;top:0 !important;left:0 !important;right:0 !important;width:100%;z-index:999}
    .mosaic{margin-top:86px}
    @media(max-width:900px){.mosaic{margin-top:60px}}
  
    /* ── FOOTER RESPONSIVE ── */
    /* Tablet: 2-column layout */
    @media(max-width:1100px){
      .footer-grid{grid-template-columns:1fr 1fr !important;gap:40px !important;padding:48px 40px !important}
    }
    /* Mobile: 1-column layout */
    @media(max-width:768px){
      .footer-grid{grid-template-columns:1fr !important;gap:32px !important;padding:40px 20px 32px !important}
    }
    /* Copyright bar: override inline padding on small screens */
    @media(max-width:768px){
      footer>div:last-child{padding-left:20px !important;padding-right:20px !important}
    }
    @media(max-width:1100px){
      footer>div:last-child{padding-left:40px !important;padding-right:40px !important}
    }
  </style>
</head>

function useNavShadow(){
  useEffect(()=>{
    const nav=document.querySelector('.nav-bar');if(!nav)return;

    window.addEventListener('scroll',handler,{passive:true});
    return ()=>window.removeEventListener('scroll',handler);
  },[]);

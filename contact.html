const h = React.createElement;
const {useState, useEffect, useRef} = React;

function useInView(threshold=0.12){
  const ref=useRef(null);
  const [visible,setVisible]=useState(false);
  useEffect(()=>{
    const el=ref.current; if(!el) return;
    const obs=new IntersectionObserver(([e])=>{if(e.isIntersecting){setVisible(true);obs.disconnect();}},{threshold});
    obs.observe(el); return ()=>obs.disconnect();
  },[]);
  return [ref,visible];
}

function useNavShadow(){
  useEffect(()=>{
    const nav=document.querySelector('.nav-bar'); if(!nav) return;
    const handler=()=>nav.classList.toggle('scrolled',window.scrollY>12);
    window.addEventListener('scroll',handler,{passive:true});
    return ()=>window.removeEventListener('scroll',handler);
  },[]);
}

/* Reveal */
const Reveal=({children,delay=0,style={},className=''})=>{
  const [ref,visible]=useInView();
  return h('div',{ref,className:`reveal${visible?' in':''} ${className}`,style:{transitionDelay:`${delay}s`,...style}},children);
};

          [{icon:h(FbIcon),label:'Facebook'},{icon:h(IgIcon),label:'Instagram'}].map(s=>
            h('a',{key:s.label,href:s.label==='Facebook'?'https://www.facebook.com/purvaatravelsofficiall/':'https://www.instagram.com/purvaatoursandtravels/','aria-label':s.label,style:{width:40,height:40,borderRadius:8,background:'rgba(255,255,255,0.1)',display:'flex',alignItems:'center',justifyContent:'center',textDecoration:'none',transition:'background .2s'},onMouseOver:e=>{e.currentTarget.style.background='#FCE205';const svg=e.currentTarget.querySelector('svg');const hasRect=svg.querySelector('rect');e.currentTarget.querySelectorAll('svg *').forEach(el=>{if(hasRect){el.setAttribute('stroke','#3B1C62');el.setAttribute('fill','none');}else{el.setAttribute('fill','#3B1C62');}})},onMouseOut:e=>{e.currentTarget.style.background='rgba(255,255,255,0.1)';const svg=e.currentTarget.querySelector('svg');const hasRect=svg.querySelector('rect');e.currentTarget.querySelectorAll('svg *').forEach(el=>{if(hasRect){el.setAttribute('stroke','#fff');el.removeAttribute('fill');}else{el.setAttribute('fill','#fff');}})}},s.icon)
          )
        )
      )
    )
  ),
  h('div',{style:{borderTop:'1px solid rgba(255,255,255,0.08)',padding:'18px 80px',display:'flex',justifyContent:'center',alignItems:'center',flexWrap:'wrap',gap:10}},
    h('p',{style:{fontSize:12,color:'rgba(255,255,255,0.38)',fontFamily:"'DM Sans',sans-serif",margin:0}},'All Rights Reserved © 2026 ',h('a',{href:'https://purvaatravels.com/',target:'_blank',style:{color:'rgba(255,255,255,0.38)',textDecoration:'none'}},['purvaatravels.com']))
  )
);

/* APP */
const App=()=>{
  const [modal,setModal]=useState(null);
  __openModal=setModal;
  return h('div',null,
    modal&&h(EnquiryModal,{tourTitle:modal,onClose:()=>setModal(null)}),
    h(Navbar),
    h(ContactHero),
    h(ContactSection),
    h(MapSection),
    h(Footer)
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>

<html lang="en">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { font-family: 'DM Sans', system-ui, sans-serif; background: #fff; color: #1A1A1A; }
    h1, h2, h3, h4 { font-family: 'Playfair Display', Georgia, serif; }

    .nav-bar { background: #432267; position: sticky; top: 0; z-index: 999; transition: box-shadow 0.3s; }
    .nav-bar.scrolled { box-shadow: 0 2px 20px rgba(0,0,0,0.25); }

    /* ── HERO ── */
    .iv-hero {
      position: relative; height: 440px; overflow: hidden;
      background: #0d1b2a;
    }
    .iv-hero-img {
      position: absolute; inset: 0; width: 100%; height: 100%;
      object-fit: cover; object-position: center center; display: block;
    }
    .iv-hero-overlay {
      position: absolute; inset: 0;

    }
    .iv-hero-content {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center; gap: 16px;
    }
    .iv-hero h1 {

      font-family: 'Playfair Display', serif; line-height: 1.12; max-width: 820px; padding: 0 24px;
    }
    .hero-rule { width: 52px; height: 3px; background: #FEED01; border-radius: 2px; margin: 0 auto; }

    /* ── SHARED ── */
    .section-label {
      font-size: 12px; font-weight: 700; letter-spacing: .18em;
      text-transform: uppercase; color: #432267;
      font-family: 'DM Sans', sans-serif; display: block; margin-bottom: 10px;
    }
    .section-heading {

    .dept-num {

    .dept-title {
      font-size: 20px; font-weight: 700; color: #432267;
      font-family: 'DM Sans', sans-serif; line-height: 1.4;

    .dest-card {

    .dest-body { padding: 22px 24px 26px; }

    .enquire-btn {

    /* ── DOMESTIC TABLE ── */

      font-size: 14.5px; color: #1A1A1A;

    .hero-anim-2 { animation: heroIn 0.85s cubic-bezier(0.22,1,0.36,1) 0.3s both; }
    .hero-anim-3 { animation: heroIn 0.85s cubic-bezier(0.22,1,0.36,1) 0.5s both; }

</head>
<body>
<div id="root"></div>
<script>
const h = React.createElement;
const {useState, useEffect, useRef} = React;
let __openModal = ()=>{};

function useInView(threshold=0.12){
  const ref=useRef(null);
  const [visible,setVisible]=useState(false);
  useEffect(()=>{
    const el=ref.current; if(!el) return;
    const obs=new IntersectionObserver(([e])=>{if(e.isIntersecting){setVisible(true);obs.disconnect();}},{threshold});
    obs.observe(el); return ()=>obs.disconnect();
  },[]);
  return [ref,visible];
}

function useNavShadow(){
  useEffect(()=>{
    const nav=document.querySelector('.nav-bar'); if(!nav) return;
    const handler=()=>nav.classList.toggle('scrolled',window.scrollY>12);
    window.addEventListener('scroll',handler,{passive:true});
    return ()=>window.removeEventListener('scroll',handler);
  },[]);
}

/* SVG ICONS */
const PhoneIcon=()=>h('svg',{width:'17',height:'17',viewBox:'0 0 24 24',fill:'none',stroke:'#FEED01',strokeWidth:'2',strokeLinecap:'round',strokeLinejoin:'round'},h('path',{d:'M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12a19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 3.6 1.27h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 8.91a16 16 0 0 0 6 6l.91-.91a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z'}));
const FbIcon=()=>h('svg',{width:'18',height:'18',viewBox:'0 0 24 24',fill:'#fff'},h('path',{d:'M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z'}));
const IgIcon=()=>h('svg',{width:'18',height:'18',viewBox:'0 0 24 24',fill:'none',stroke:'#fff',strokeWidth:'2',strokeLinecap:'round',strokeLinejoin:'round'},h('rect',{x:'2',y:'2',width:'20',height:'20',rx:'5',fill:'none'}),h('path',{d:'M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z',fill:'none'}),h('line',{x1:'17.5',y1:'6.5',x2:'17.51',y2:'6.5',stroke:'#fff'}));
const CheckIcon=()=>h('svg',{width:12,height:12,viewBox:'0 0 12 12',fill:'none'},h('path',{d:'M2 6l3 3 5-5',stroke:'#fff',strokeWidth:1.8,strokeLinecap:'round',strokeLinejoin:'round'}));

const Reveal=({children,delay=0,className=''})=>{
  const [ref,visible]=useInView();
  return h('div',{ref,className:`reveal${visible?' in':''} ${className}`,style:{transitionDelay:`${delay}s`}},children);
};

/* NAVBAR */
const NAV_LINKS = ['About Us','Our Tours','Gallery','Contact Us'];
const NAV_HREFS = {'Contact Us':'./contact.html','Our Tours':'./our-tours.html','Gallery':'./gallery.html','About Us':'./about.html'};

const Navbar=()=>{
  useNavShadow();
  const [active,setActive]=useState('');
  const [menuOpen,setMenuOpen]=useState(false);
  return h('nav',{className:'nav-bar'},
    h('div',{className:'nav-inner'},
      h('a',{href:'./purvaa-homepage-v3-fixed.html',className:'nav-logo'},
        h('img',{src:'./logo/white-logo-transparent.png',alt:'Purvaa Tours & Travels',style:{height:86,width:'auto',display:'block'}})
      ),
      h('button',{className:'ham-btn',onClick:()=>setMenuOpen(m=>!m),'aria-label':'Menu'},menuOpen?'✕':'☰'),

          )

          h('a',{href:'tel:+919869272960',style:{color:'#FEED01',fontSize:16,fontWeight:600,textDecoration:'none',fontFamily:"'DM Sans',sans-serif",display:'flex',alignItems:'center',gap:7}},h(PhoneIcon),'+91 98692 72960'),
          h('button',{onClick:()=>__openModal('Plan My Trip'),style:{background:'#fff',color:'#432267',border:'none',padding:'11px 26px',borderRadius:5,fontSize:16,fontWeight:700,cursor:'pointer',fontFamily:"'DM Sans',sans-serif",transition:'background .2s'},onMouseOver:e=>e.currentTarget.style.background='#FEED01',onMouseOut:e=>e.currentTarget.style.background='#fff'},'Plan My Trip')

      )
    )

/* ── ENQUIRY MODAL ── */
const EnquiryModal=({tourTitle,onClose})=>{
  const [form,setForm]=useState({name:'',phone:'',email:'',date:'',message:''});
  const set=k=>e=>setForm(f=>({...f,[k]:e.target.value}));
  const inp={width:'100%',border:'1.5px solid #e0d8f0',borderRadius:6,padding:'10px 12px',fontSize:14,fontFamily:"'DM Sans',sans-serif",outline:'none',boxSizing:'border-box',color:'#1A1A1A'};
  const lbl={display:'block',fontSize:13,fontWeight:600,color:'#444',marginBottom:5,fontFamily:"'DM Sans',sans-serif"};
  const submit=e=>{
    e.preventDefault();
    const msg=`Hello Purvaa Tours & Travels,\n\nI would like to enquire about: ${tourTitle}\n\nName: ${form.name}\nPhone: ${form.phone}\nEmail: ${form.email}\nPreferred Travel Date: ${form.date||'Not specified'}\nMessage: ${form.message||'No message'}`;
    window.open(`https://wa.me/919869272960?text=${encodeURIComponent(msg)}`,'_blank');
    onClose();
  };
  useEffect(()=>{
    const prev=document.body.style.overflow;
    document.body.style.overflow='hidden';
    return ()=>{document.body.style.overflow=prev;};
  },[]);
  return h('div',{style:{position:'fixed',inset:0,background:'rgba(0,0,0,0.58)',zIndex:9999,display:'flex',alignItems:'center',justifyContent:'center',padding:'16px'},onClick:onClose},
    h('div',{style:{background:'#fff',borderRadius:14,padding:'36px 32px 30px',maxWidth:460,width:'100%',position:'relative',boxShadow:'0 24px 64px rgba(0,0,0,0.22)'},onClick:e=>e.stopPropagation()},
      h('button',{onClick:onClose,style:{position:'absolute',top:14,right:18,background:'none',border:'none',fontSize:24,cursor:'pointer',color:'#999',lineHeight:1}},'×'),
      h('h3',{style:{margin:'0 0 20px',fontFamily:"'Playfair Display',serif",fontSize:22,color:'#432267'}},'Plan My Trip'),
      h('form',{onSubmit:submit},
        h('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:14,marginBottom:14}},
          h('div',null,h('label',{style:lbl},'Name *'),h('input',{required:true,value:form.name,onChange:set('name'),placeholder:'Your name',style:inp})),
          h('div',null,h('label',{style:lbl},'Phone *'),h('input',{required:true,type:'tel',value:form.phone,onChange:set('phone'),placeholder:'Your number',style:inp}))
        ),
        h('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:14,marginBottom:14}},
          h('div',null,h('label',{style:lbl},'Email'),h('input',{type:'email',value:form.email,onChange:set('email'),placeholder:'your@email.com',style:inp})),
          h('div',null,h('label',{style:lbl},'Preferred Travel Date'),h('input',{type:'date',value:form.date,onChange:set('date'),style:inp}))
        ),
        h('div',{style:{marginBottom:22}},
          h('label',{style:lbl},'Message'),
          h('textarea',{value:form.message,onChange:set('message'),placeholder:'Any specific requirements or questions?',rows:3,style:{...inp,resize:'vertical'}})
        ),
        h('button',{type:'submit',style:{width:'100%',background:'#FEED01',color:'#432267',border:'none',padding:'13px',borderRadius:6,fontSize:15,fontWeight:700,cursor:'pointer',fontFamily:"'DM Sans',sans-serif",letterSpacing:'.01em'}},'Send Enquiry via WhatsApp')
      )
    )
  );
};

const App=()=>{
  const [modal,setModal]=useState(null);
  __openModal=setModal;
  return h('div',null,
    modal&&h(EnquiryModal,{tourTitle:modal,onClose:()=>setModal(null)}),
    h(Navbar),
    h(Hero),
    h(ProgramsSection),
    h(DomesticSection),
    h(IncludesSection),
    h(Footer)
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(h(App));

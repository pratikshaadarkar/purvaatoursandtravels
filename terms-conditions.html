<!DOCTYPE html>
<html lang="en">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            pp: '#432267',
            py: '#FEED01',
            pc: '#FFF8DC',
            pn: '#0D1B2A',
            pb: '#1A3A6B',
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,800;1,700&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />

  <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="./assets/js/script.js"></script>
  <link rel="stylesheet" href="./assets/css/style.css">

<body>
<div id="root"></div>
<script>
const h = React.createElement;
const {useState, useEffect, useRef} = React;

function useNavShadow(){
  useEffect(()=>{
    const nav=document.querySelector('.nav-bar'); if(!nav) return;
    const handler=()=>nav.classList.toggle('scrolled',window.scrollY>12);
    window.addEventListener('scroll',handler,{passive:true});
    return ()=>window.removeEventListener('scroll',handler);
  },[]);
}

const PhoneIcon=()=>h('svg',{width:'17',height:'17',viewBox:'0 0 24 24',fill:'none',stroke:'#FEED01',strokeWidth:'2',strokeLinecap:'round',strokeLinejoin:'round'},h('path',{d:'M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12a19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 3.6 1.27h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 8.91a16 16 0 0 0 6 6l.91-.91a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z'}));
const FbIcon=()=>h('svg',{width:'18',height:'18',viewBox:'0 0 24 24',fill:'#fff'},h('path',{d:'M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z'}));
const IgIcon=()=>h('svg',{width:'18',height:'18',viewBox:'0 0 24 24',fill:'none',stroke:'#fff',strokeWidth:'2',strokeLinecap:'round',strokeLinejoin:'round'},h('rect',{x:'2',y:'2',width:'20',height:'20',rx:'5'}),h('path',{d:'M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z'}),h('line',{x1:'17.5',y1:'6.5',x2:'17.51',y2:'6.5'}));

let __openModal = ()=>{};
const EnquiryModal=({tourTitle,onClose})=>{
  const [form,setForm]=useState({name:'',phone:'',email:'',date:'',message:''});
  const set=k=>e=>setForm(f=>({...f,[k]:e.target.value}));
  const inp={width:'100%',border:'1.5px solid #e0d8f0',borderRadius:6,padding:'10px 12px',fontSize:14,fontFamily:"'DM Sans',sans-serif",outline:'none',boxSizing:'border-box',color:'#1A1A1A'};
  const lbl={display:'block',fontSize:13,fontWeight:600,color:'#444',marginBottom:5,fontFamily:"'DM Sans',sans-serif"};
  const submit=e=>{
    e.preventDefault();
    const msg=`Hello Purvaa Tours & Travels,\n\nI would like to enquire about: ${tourTitle}\n\nName: ${form.name}\nPhone: ${form.phone}\nEmail: ${form.email}\nPreferred Travel Date: ${form.date||'Not specified'}\nMessage: ${form.message||'No message'}`;
    window.open(`https://wa.me/919869272960?text=${encodeURIComponent(msg)}`,'_blank');
    onClose();
  };
  useEffect(()=>{
    const prev=document.body.style.overflow;
    document.body.style.overflow='hidden';
    return ()=>{document.body.style.overflow=prev;};
  },[]);
  return h('div',{style:{position:'fixed',inset:0,background:'rgba(0,0,0,0.58)',zIndex:9999,display:'flex',alignItems:'center',justifyContent:'center',padding:'16px'},onClick:onClose},
    h('div',{style:{background:'#fff',borderRadius:14,padding:'36px 32px 30px',maxWidth:460,width:'100%',position:'relative',boxShadow:'0 24px 64px rgba(0,0,0,0.22)'},onClick:e=>e.stopPropagation()},
      h('button',{onClick:onClose,style:{position:'absolute',top:14,right:18,background:'none',border:'none',fontSize:24,cursor:'pointer',color:'#999',lineHeight:1}},'×'),
      h('h3',{style:{margin:'0 0 20px',fontFamily:"'Playfair Display',serif",fontSize:22,color:'#432267'}},'Plan My Trip'),
      h('form',{onSubmit:submit},
        h('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:14,marginBottom:14}},
          h('div',null,h('label',{style:lbl},'Name *'),h('input',{required:true,value:form.name,onChange:set('name'),placeholder:'Your name',style:inp})),
          h('div',null,h('label',{style:lbl},'Phone *'),h('input',{required:true,type:'tel',value:form.phone,onChange:set('phone'),placeholder:'Your number',style:inp}))
        ),
        h('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:14,marginBottom:14}},
          h('div',null,h('label',{style:lbl},'Email'),h('input',{type:'email',value:form.email,onChange:set('email'),placeholder:'your@email.com',style:inp})),
          h('div',null,h('label',{style:lbl},'Preferred Travel Date'),h('input',{type:'date',value:form.date,onChange:set('date'),style:inp}))
        ),
        h('div',{style:{marginBottom:22}},
          h('label',{style:lbl},'Message'),
          h('textarea',{value:form.message,onChange:set('message'),placeholder:'Any specific requirements or questions?',rows:3,style:{...inp,resize:'vertical'}})
        ),
        h('button',{type:'submit',style:{width:'100%',background:'#FEED01',color:'#432267',border:'none',padding:'13px',borderRadius:6,fontSize:15,fontWeight:700,cursor:'pointer',fontFamily:"'DM Sans',sans-serif",letterSpacing:'.01em'}},'Send Enquiry via WhatsApp')
      )
    )
  );
};

/* NAVBAR */
const Navbar=()=>{
  useNavShadow();
  const [activeLink,setActiveLink]=useState(null);
  const [menuOpen,setMenuOpen]=useState(false);
  return h('nav',{className:'nav-bar'},
    h('div',{className:'nav-inner'},
      h('a',{href:'./index.html',className:'nav-logo'},
        h('img',{src:'./assets/images/logo/white-logo-transparent.png',alt:'Purvaa Tours & Travels',style:{height:86,width:'auto',display:'block'}})
      ),
      h('button',{className:'ham-btn',onClick:()=>setMenuOpen(m=>!m),'aria-label':'Menu'},menuOpen?'✕':'☰'),
      h('div',{className:`nav-menu${menuOpen?' open':''}`},
        h('div',{className:'nav-links-wrap'},
          ['About Us','Our Tours','Gallery','Contact Us'].map(l=>
            h('a',{key:l,href:l==='Contact Us'?'contact.html':l==='Gallery'?'gallery.html':l==='About Us'?'about.html':l==='Our Tours'?'our-tours.html':'#',style:{color:activeLink===l?'#FEED01':'rgba(255,255,255,0.88)',textDecoration:'none',transition:'color .2s',fontFamily:"'DM Sans',sans-serif",fontSize:18,fontWeight:500},onMouseOver:e=>e.target.style.color='#FEED01',onMouseOut:e=>e.target.style.color=activeLink===l?'#FEED01':'rgba(255,255,255,0.88)',onClick:()=>setActiveLink(l)},l)
          )
        ),
        h('div',{className:'nav-actions'},
          h('a',{href:'tel:+919869272960',style:{color:'#FEED01',fontSize:16,fontWeight:600,textDecoration:'none',fontFamily:"'DM Sans',sans-serif",letterSpacing:'.01em',display:'flex',alignItems:'center',gap:7,borderBottom:'2px solid transparent',transition:'border-color .2s'},onMouseOver:e=>e.target.style.borderBottom='2px solid #FEED01',onMouseOut:e=>e.target.style.borderBottom='2px solid transparent'},h(PhoneIcon),'+91 98692 72960'),
          h('button',{onClick:()=>__openModal('Plan My Trip'),style:{background:'#fff',color:'#432267',border:'none',padding:'11px 26px',borderRadius:5,fontSize:16,fontWeight:700,cursor:'pointer',fontFamily:"'DM Sans',sans-serif",letterSpacing:'.01em',transition:'background .2s'},onMouseOver:e=>e.currentTarget.style.background='#FEED01',onMouseOut:e=>e.currentTarget.style.background='#fff'},'Plan My Trip')
        )
      )
    )
  );
};

/* FOOTER */
const Footer=()=>h('footer',{style:{background:'#2d1845'}},
  h('div',{className:'footer-grid'},
    h('div',{style:{marginTop:'-20px'}},
      h('img',{src:'./assets/images/logo/white-logo-transparent.png',alt:'Purvaa Tours & Travels',style:{width:220,display:'block',marginBottom:20,opacity:0.92}}),
      h('p',{style:{fontSize:15,color:'rgba(255,255,255,0.68)',lineHeight:1.85,marginBottom:28,fontFamily:"'DM Sans',sans-serif",maxWidth:340}},'Purvaa is the travel management company Mumbai families have trusted since 1996 because we handle everything personally and have maintained our quality standards across 30 years.'),
      h('button',{onClick:()=>__openModal('Quick Enquiry'),style:{background:'#FEED01',color:'#1A1A1A',border:'none',padding:'14px 30px',borderRadius:6,fontSize:15,fontWeight:700,cursor:'pointer',fontFamily:"'DM Sans',sans-serif",letterSpacing:'.01em'},onMouseOver:e=>e.currentTarget.style.background='#fff',onMouseOut:e=>e.currentTarget.style.background='#FEED01'},'Quick Enquiry')
    ),
    h('div',null,
      h('div',{style:{fontSize:15,fontWeight:700,color:'#fff',letterSpacing:'.13em',marginBottom:22,fontFamily:"'DM Sans',sans-serif"}},'Quick Links'),
      ['About Us','Our Tours','Gallery','Contact Us','Privacy Policy','Terms & Conditions'].map(l=>h('a',{key:l,href:l==='Contact Us'?'contact.html':l==='Gallery'?'gallery.html':l==='About Us'?'about.html':l==='Our Tours'?'our-tours.html':l==='Privacy Policy'?'privacy-policy.html':l==='Terms & Conditions'?'terms-conditions.html':'#',style:{display:'block',color:'rgba(255,255,255,0.75)',fontSize:14,textDecoration:'none',marginBottom:14,fontFamily:"'DM Sans',sans-serif",transition:'color .2s'},onMouseOver:e=>e.target.style.color='#FEED01',onMouseOut:e=>e.target.style.color='rgba(255,255,255,0.75)'},l))
    ),
    h('div',{style:{display:'flex',flexDirection:'column',gap:24}},
      h('div',null,h('div',{style:{fontSize:15,fontWeight:700,color:'#fff',letterSpacing:'.13em',marginBottom:10,fontFamily:"'DM Sans',sans-serif"}},'For Enquiries'),h('div',{style:{display:'flex',alignItems:'center',gap:10,marginBottom:10}},h('svg',{width:'16',height:'16',viewBox:'0 0 24 24',fill:'none',stroke:'#fff',strokeWidth:'2',strokeLinecap:'round',strokeLinejoin:'round'},h('path',{d:'M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12a19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 3.6 1.27h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 8.91a16 16 0 0 0 6 6l.91-.91a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z'})),h('a',{href:'tel:+919869272960',style:{color:'rgba(255,255,255,0.82)',fontSize:14,textDecoration:'none',fontFamily:"'DM Sans',sans-serif",transition:'color 0.2s'},onMouseOver:e=>e.target.style.color='#FEED01',onMouseOut:e=>e.target.style.color='rgba(255,255,255,0.82)'},'+91 98692 72960')),h('div',{style:{display:'flex',alignItems:'center',gap:10}},h('svg',{width:'16',height:'16',viewBox:'0 0 24 24',fill:'none',stroke:'#fff',strokeWidth:'2',strokeLinecap:'round',strokeLinejoin:'round'},h('path',{d:'M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z'}),h('polyline',{points:'22,6 12,13 2,6'})),h('a',{href:'mailto:info.purvaatravels@gmail.com',style:{color:'rgba(255,255,255,0.82)',fontSize:14,textDecoration:'none',fontFamily:"'DM Sans',sans-serif",transition:'color 0.2s'},onMouseOver:e=>e.target.style.color='#FEED01',onMouseOut:e=>e.target.style.color='rgba(255,255,255,0.82)'},'info.purvaatravels@gmail.com'))),
      h('div',null,
        h('div',{style:{fontSize:15,fontWeight:700,color:'#fff',letterSpacing:'.13em',marginBottom:10,fontFamily:"'DM Sans',sans-serif"}},'Address'),
        h('p',{style:{fontSize:14,color:'rgba(255,255,255,0.72)',lineHeight:1.75,fontFamily:"'DM Sans',sans-serif",margin:0}},'Sitaram Niwas, 4, Shivadarshan Path,',h('br'),'Nardas Nagar, W, Bhandup West,',h('br'),'Mumbai, Maharashtra 400078')
      ),
      h('div',null,
        h('div',{style:{fontSize:15,fontWeight:700,color:'#fff',letterSpacing:'.13em',marginBottom:12,fontFamily:"'DM Sans',sans-serif"}},'Connect With Us'),
        h('div',{style:{display:'flex',gap:10}},
          [{icon:h(FbIcon),label:'Facebook'},{icon:h(IgIcon),label:'Instagram'}].map(s=>
            h('a',{key:s.label,href:s.label==='Facebook'?'https://www.facebook.com/purvaatravelsofficiall/':'https://www.instagram.com/purvaatoursandtravels/',target:'_blank','aria-label':s.label,style:{width:40,height:40,borderRadius:8,background:'rgba(255,255,255,0.1)',display:'flex',alignItems:'center',justifyContent:'center',textDecoration:'none',transition:'background .2s'},onMouseOver:e=>{e.currentTarget.style.background='#FCE205';const svg=e.currentTarget.querySelector('svg');const hasRect=svg.querySelector('rect');e.currentTarget.querySelectorAll('svg *').forEach(el=>{if(hasRect){el.setAttribute('stroke','#3B1C62');el.setAttribute('fill','none');}else{el.setAttribute('fill','#3B1C62');}})},onMouseOut:e=>{e.currentTarget.style.background='rgba(255,255,255,0.1)';const svg=e.currentTarget.querySelector('svg');const hasRect=svg.querySelector('rect');e.currentTarget.querySelectorAll('svg *').forEach(el=>{if(hasRect){el.setAttribute('stroke','#fff');el.removeAttribute('fill');}else{el.setAttribute('fill','#fff');}})}},s.icon)
          )
        )
      )
    )
  ),
  h('div',{style:{borderTop:'1px solid rgba(255,255,255,0.08)',padding:'18px 80px',display:'flex',justifyContent:'center',alignItems:'center',flexWrap:'wrap',gap:10}},
    h('p',{style:{fontSize:12,color:'rgba(255,255,255,0.38)',fontFamily:"'DM Sans',sans-serif",margin:0}},'All Rights Reserved © 2026 ',h('a',{href:'https://purvaatravels.com/',target:'_blank',style:{color:'rgba(255,255,255,0.38)',textDecoration:'none'}},['purvaatravels.com']))
  )
);

/* MAIN APP */
const App=()=>{
  const [modal,setModal]=useState(null);
  __openModal=setModal;
  return h('div',null,
    modal&&h(EnquiryModal,{tourTitle:modal,onClose:()=>setModal(null)}),
    h(Navbar),
    h('section',{className:'hero-section',style:{backgroundImage:"url('./assets/images/terms-hero.jpg')",backgroundSize:'cover',backgroundPosition:'center'}},
      h('h1',null,'Terms & Conditions')
  ),
  h('div',{className:'content-wrapper'},
    h('div',{className:'content-section'},
      h('h2',null,'Please Read Before You Book'),
      h('p',null,'Your booking is governed by the Terms and Conditions for Purvaa Tours & Travels given below and the terms of business under which your booking is made. These terms exist to make sure both sides know what to expect.')
    ),
    h('div',{className:'content-section'},
      h('h2',null,'Rates'),
      h('p',null,'All rates are per person in Indian Rupees. The charges include transportation, hotel accommodation, food, and sightseeing entry tickets as specified in your tour package.')
    ),
    h('div',{className:'content-section'},
      h('h2',null,'Travel Documents'),
      h('p',null,'All travellers must carry a valid government-issued photo ID (Aadhaar Card, Passport, Driving Licence, or equivalent) at all times during the tour. Any behaviour that disturbs the group or violates local laws will result in removal from the tour without refund.')
    ),
    h('div',{className:'content-section'},
      h('h2',null,'Booking Confirmation'),
      h('p',null,'Your seat is confirmed only after we receive your advance payment and send you a written confirmation. A verbal conversation does not hold your seat.')
    ),
    h('div',{className:'content-section'},
      h('h2',null,'Payment'),
      h('p',null,'All payments are to be made in advance by Demand Draft or Cheque favouring "PURVAA TOUR & TRAVELS", payable at our Mumbai office only. The remaining amount must be paid as per the schedule we share with you. Unpaid seats may be released without notice.')
    ),
    h('div',{className:'content-section'},
      h('h2',null,'Accommodation'),
      h('p',null,'Lodging and boarding will be provided at destinations with standard amenities. Room allocation is based on the tour package and group size. Basic toiletries may not be provided at all properties — we recommend carrying your own.')
    ),
    h('div',{className:'content-section'},
      h('h2',null,'Tour Cost Does Not Include'),
      h('ul',{style:{marginLeft:'30px',color:'#000',fontSize:'17px',lineHeight:'1.85',fontFamily:"'DM Sans',sans-serif",listStyle:'disc'}},
        h('li',null,'Pony charges at hill stations'),
        h('li',null,'Laundry expenses'),
        h('li',null,'Optional tour costs'),
        h('li',null,'Incidental and personal expenses'),
        h('li',null,'Any increase in railway, sea, or air fares — the difference will be borne by participants')
      )
    ),
    h('div',{className:'content-section'},
      h('h2',null,'Check In / Check Out'),
      h('p',null,'Participants must enter and vacate their rooms as per the check-in and check-out times of the respective hotels. Please take care of your belongings before check-in and after check-out. The Tour Manager will guide you in this regard.')
    ),
    h('div',{className:'content-section'},
      h('h2',null,'Cancellation Policy'),
      h('p',{style:{marginBottom:'10px'}},'If a tour is cancelled from our end, we will refund 90% of the tour amount to the institution. If you need to cancel, the cancellation must be intimated to us in writing. The following charges apply:'),
      h('ul',{style:{marginBottom:'12px',marginLeft:'30px',color:'#000',fontSize:'17px',lineHeight:'1.85',fontFamily:"'DM Sans',sans-serif",listStyle:'disc'}},
        h('li',null,'30 days or more before departure: 25% of the tour price.'),
        h('li',null,'20 to 30 days before departure: 50% of the tour price.'),
        h('li',null,'10 to 20 days before departure: 75% of the tour price.'),
        h('li',null,'Within 10 days of departure: 100% (no refund).')
      )
    ),
    h('div',{className:'content-section'},
      h('h2',null,'Refund Policy'),
      h('p',null,'Refunds are processed within 7 to 10 working days from the date of cancellation confirmation. The refund goes back to the same account used at the time of payment. Cash refunds are not provided.')
    ),
    h('div',{className:'content-section'},
      h('h2',null,'Itinerary Changes'),
      h('p',null,'All tour departures, itineraries, and hotels are subject to change with or without prior notice, as they are based on current schedules of the transportation companies concerned. We will always inform you as early as possible.')
    ),
    h('div',{className:'content-section'},
      h('h2',null,'Health Conditions'),
      h('p',null,'If you or anyone in your group has a pre-existing medical condition, please inform us at the time of booking. This helps us plan better and keep your group safe.')
    ),
    h('div',{className:'content-section'},
      h('h2',null,'Personal Belongings'),
      h('p',null,'Purvaa Tours & Travels is not responsible for loss or damage to personal belongings during the tour. We recommend carrying travel insurance.')
    ),
    h('div',{className:'content-section'},
      h('h2',null,'Force Majeure'),
      h('p',null,'We are not liable for delays, cancellations, or losses caused by events beyond our control, including natural disasters, strikes, or government restrictions.')
    ),
    h('div',{className:'content-section'},
      h('h2',null,'Disputes'),
      h('p',null,'These terms are governed by Indian law. Any disputes are subject to the jurisdiction of courts in Mumbai, Maharashtra.')
    ),
    h('div',{className:'content-section'},
      h('h2',null,'Still Have Questions?'),
      h('p',null,'Call us on +91 98692 72960 or email ',h('a',{href:'mailto:info.purvaatravels@gmail.com'},'info.purvaatravels@gmail.com'),'.')
    )
  ),
    h(Footer)
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>

</body>
</html>
